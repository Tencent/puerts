name: nuget build & publish

on:
  push:
    paths: 
      - unity/upms/**
      - unity/test/**
      - unity/native/**
      - unity/cli/**
      - unreal/Puerts/Source/JsEnv/Private/V8InspectorImpl.cpp
      - unreal/Puerts/Source/JsEnv/Private/V8InspectorImpl.h
      - unreal/Puerts/Source/JsEnv/Private/WebSocketImpl.cpp
      - unreal/Puerts/Source/JsEnv/Private/PromiseRejectCallback.hpp
      - .github/workflows/build_nuget.yml
  pull_request:
    paths: 
      - unity/upms/**
      - unity/test/**
      - unity/native/**
      - unity/cli/**
      - unreal/Puerts/Source/JsEnv/Private/V8InspectorImpl.cpp
      - unreal/Puerts/Source/JsEnv/Private/V8InspectorImpl.h
      - unreal/Puerts/Source/JsEnv/Private/WebSocketImpl.cpp
      - unreal/Puerts/Source/JsEnv/Private/PromiseRejectCallback.hpp
      - .github/workflows/build_nuget.yml
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package?'
        required: true
        default: false
        type: boolean

env:
  # Single source of truth for the bundled Python on every desktop platform.
  # libPapiPython is built against these exact distributions and they are the ones shipped in the nuget package.
  PY_MINOR_VERSION: '3.14'
  PY_OSX_ARM64_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260127/cpython-3.14.2+20260127-aarch64-apple-darwin-install_only.tar.gz
  PY_LINUX_X64_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20251217/cpython-3.14.2+20251217-x86_64_v2-unknown-linux-gnu-install_only_stripped.tar.gz
  # Windows: build against the official nuget package (has include/ and libs/), ship the official embed zip of the same release
  PY_WIN_X64_NUGET_URL: https://www.nuget.org/api/v2/package/python/3.14.2
  PY_WIN_X64_EMBED_URL: https://www.python.org/ftp/python/3.14.2/python-3.14.2-embed-amd64.zip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_BACKENDS: puerts papi-lua papi-quickjs papi-v8 papi-nodejs papi-python
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-15
            platform: osx
            arch: arm64

    steps:
      - uses: actions/checkout@v4
      
      - name: Install libc++-dev (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Build all native backends (Linux)
        if: runner.os == 'Linux'
        run: |
          set -ex
          backends="${NATIVE_BACKENDS}"
          repo_root=$(pwd)

          # Download the exact Python distribution that will be bundled, and build papi-python against it
          py_dir="$RUNNER_TEMP/python-linux-x64"
          mkdir -p "$py_dir"
          curl -fsSL "$PY_LINUX_X64_URL" -o "$RUNNER_TEMP/python-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/python-linux-x64.tar.gz" -C "$py_dir"
          export PUERTS_PYTHON_ROOT="$py_dir/python"
          export PUERTS_PYTHON_VERSION="$PY_MINOR_VERSION"
          ls -la "$PUERTS_PYTHON_ROOT/lib" "$PUERTS_PYTHON_ROOT/include"

          for backend in $backends; do
            echo "Building $backend for ${{ matrix.platform }}-${{ matrix.arch }}"
            cd "$repo_root/unity/native/$backend"
            node ../../cli make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --expose_gc
            cd "$repo_root"
          done

      - name: Verify Linux libPapiPython dependencies
        if: runner.os == 'Linux'
        run: |
          set -e
          lib="unity/native/papi-python/build_linux_x64_papi-python/libPapiPython.so"
          readelf -d "$lib"
          py_deps=$(readelf -d "$lib" | grep '(NEEDED)' | grep -io 'libpython[^]]*' || true)
          expected="libpython${PY_MINOR_VERSION}.so.1.0"
          if [ "$py_deps" != "$expected" ]; then
            echo "::error::libPapiPython must only depend on $expected, got: $py_deps"
            exit 1
          fi
          rpath=$(readelf -d "$lib" | grep -E '\((RUNPATH|RPATH)\)' | sed -E 's/.*\[(.*)\].*/\1/')
          if [ "$rpath" != '$ORIGIN' ]; then
            echo "::error::libPapiPython RUNPATH must be exactly \$ORIGIN, got: $rpath"
            exit 1
          fi

      - name: Build all native backends (macOS)
        if: runner.os == 'macOS'
        run: |
          set -ex
          backends="${NATIVE_BACKENDS}"
          repo_root=$(pwd)

          # Download the exact Python distribution that will be bundled, and build papi-python against it
          py_dir="$RUNNER_TEMP/python-osx-arm64"
          mkdir -p "$py_dir"
          curl -fsSL "$PY_OSX_ARM64_URL" -o "$RUNNER_TEMP/python-osx-arm64.tar.gz"
          tar -xzf "$RUNNER_TEMP/python-osx-arm64.tar.gz" -C "$py_dir"
          export PUERTS_PYTHON_ROOT="$py_dir/python"
          export PUERTS_PYTHON_VERSION="$PY_MINOR_VERSION"
          ls "$PUERTS_PYTHON_ROOT/lib" "$PUERTS_PYTHON_ROOT/include"

          for backend in $backends; do
            echo "Building $backend for ${{ matrix.platform }}"
            cd "$repo_root/unity/native/$backend"
            node ../../cli make --platform ${{ matrix.platform }} --arch arm64 --expose_gc
            cd "$repo_root"
          done

      - name: Build all native backends (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          $backends = $env:NATIVE_BACKENDS.Split(" ")
          $repoRoot = (Get-Location)

          # Download the official Python nuget package (headers + import libs) of the release that will be bundled
          $pyDir = Join-Path $env:RUNNER_TEMP "python-win-x64"
          $pyZip = Join-Path $env:RUNNER_TEMP "python-win-x64.zip"
          Invoke-WebRequest -Uri $env:PY_WIN_X64_NUGET_URL -OutFile $pyZip
          Expand-Archive -Path $pyZip -DestinationPath $pyDir -Force
          $env:PUERTS_PYTHON_ROOT = (Join-Path $pyDir "tools").Replace('\', '/')
          $env:PUERTS_PYTHON_VERSION = $env:PY_MINOR_VERSION
          Get-ChildItem "$env:PUERTS_PYTHON_ROOT/libs", "$env:PUERTS_PYTHON_ROOT/include/patchlevel.h"

          foreach ($backend in $backends) {
            Write-Host "Building $backend for ${{ matrix.platform }}-${{ matrix.arch }}"
            Set-Location "$repoRoot/unity/native/$backend"
            node ../../cli make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --expose_gc
            Set-Location $repoRoot
          }
        shell: pwsh

      - name: Verify Windows PapiPython dependencies
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          $lib = "unity/native/papi-python/build_win_x64_papi-python/Release/PapiPython.dll"
          $objdump = (Get-Command llvm-objdump -ErrorAction SilentlyContinue).Source
          if (-not $objdump) { $objdump = "C:/Program Files/LLVM/bin/llvm-objdump.exe" }
          if (-not (Test-Path $objdump)) {
            Write-Warning "llvm-objdump not found, skip dependency verification"
            exit 0
          }
          $deps = & $objdump -p $lib | Select-String "DLL Name:\s*(\S+)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $deps | ForEach-Object { Write-Host "  $_" }
          $pyDeps = @($deps | Where-Object { $_ -match '^python' })
          $expected = "python$($env:PY_MINOR_VERSION.Replace('.', '')).dll"
          if ($pyDeps.Count -ne 1 -or $pyDeps[0] -ine $expected) {
            Write-Host "::error::PapiPython.dll must only depend on $expected, got: $($pyDeps -join ', ')"
            exit 1
          }
        shell: pwsh
      
        # See: https://github.com/Tencent/puerts/blob/e230b37c313c62185ceb5207c37e79e53e1afada/unity/cli/make.mjs#L173
        # mv(`${CMAKE_BUILD_PATH}/${options.config}/lib${cmakeAddedLibraryName}.dylib`, `${CMAKE_BUILD_PATH}/${options.config}/${cmakeAddedLibraryName}.bundle`);
        # generated builds unity/upms/*/Plugins/macOS/*.bundle
        # Rename macOS bundle format to dylib files to ensure upload-artifact works correctly
      - name: Process macOS native artifacts
        if: runner.os == 'macOS'
        run: |
          set -ex
          for dir in unity/upms/*/Plugins/macOS; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.bundle; do
                [ -f "$file" ] && mv -n "$file" "${file%.bundle}.dylib"
                echo "Renamed $file to ${file%.bundle}.dylib"
              done
            fi
          done

      - name: Verify macOS libPapiPython dependencies
        if: runner.os == 'macOS'
        run: |
          set -e
          lib="unity/upms/python/Plugins/macOS/arm64/libPapiPython.dylib"
          otool -L "$lib"
          py_deps=$(otool -L "$lib" | tail -n +2 | awk '{print $1}' | grep -i python | grep -v PapiPython || true)
          expected="@rpath/libpython${PY_MINOR_VERSION}.dylib"
          if [ "$py_deps" != "$expected" ]; then
            echo "::error::libPapiPython must only depend on $expected, got: $py_deps"
            exit 1
          fi
          if ! otool -l "$lib" | grep -A2 LC_RPATH | grep -q '@loader_path'; then
            echo "::error::libPapiPython is missing LC_RPATH @loader_path"
            exit 1
          fi
          codesign --verify --verbose "$lib"
      
      # puerts\unity\native\papi-nodejs\.backends\papi-nodejs\lib\Linux\libnode.so.93
      # puerts\unity\native\papi-nodejs\.backends\papi-nodejs\lib\Win64\libnode.dll
      # puerts\unity\native\papi-nodejs\.backends\papi-nodejs\lib\macOS\libnode.93.dylib
      - name: Process libraries dependencies
        run: |
          # Move libnode libraries to build directories
          if ("${{ matrix.platform }}" -eq "linux") {
            if (Test-Path "unity/native/papi-nodejs/build_linux_x64_papi-nodejs") {
              Move-Item -Path "unity/native/papi-nodejs/.backends/papi-nodejs/lib/Linux/libnode.so.93" -Destination "unity/native/papi-nodejs/build_linux_x64_papi-nodejs/libnode.so.93" -Force
            }
            if (Test-Path "unity/native/papi-python/build_linux_x64_papi-python") {
              # Remove python's libPuertsCore.so on Linux
              Remove-Item "unity/native/papi-python/build_linux_x64_papi-python/libPuertsCore.so" -Force
            }
          }
          if ("${{ matrix.platform }}" -eq "win" -and (Test-Path "unity/native/papi-nodejs/build_win_x64_papi-nodejs/Release")) {
            Move-Item -Path "unity/native/papi-nodejs/.backends/papi-nodejs/lib/Win64/libnode.dll" -Destination "unity/native/papi-nodejs/build_win_x64_papi-nodejs/Release/libnode.dll" -Force
          }
          if ("${{ matrix.platform }}" -eq "osx" -and (Test-Path "unity/upms/nodejs/Plugins/macOS")) {
            Move-Item -Path "unity/native/papi-nodejs/.backends/papi-nodejs/lib/macOS/libnode.93.dylib" -Destination "unity/upms/nodejs/Plugins/macOS/libnode.93.dylib" -Force
          }
          if ("${{ matrix.platform }}" -eq "win") {
            # Remove python's PuertsCore.dll on Windows
            $puertsCorePath = "unity/native/papi-python/build_win_x64_papi-python/Release/PuertsCore.dll"
            if (Test-Path $puertsCorePath) {
              Remove-Item $puertsCorePath -Force
              Write-Host "Removed $puertsCorePath to avoid duplicate PuertsCore.dll."
            }
          }
        shell: pwsh
      
      - name: Upload all native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            unity/upms/core/Plugins/**/*.dylib
            unity/upms/v8/Plugins/**/*.dylib
            unity/upms/nodejs/Plugins/**/*.dylib
            unity/upms/lua/Plugins/**/*.dylib
            unity/upms/python/Plugins/**/*.dylib
            unity/upms/quickjs/Plugins/**/*.dylib
            
            unity/native/papi-lua/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/papi-lua/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so

            unity/native/papi-nodejs/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/papi-nodejs/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so
            unity/native/papi-nodejs/build_linux_x64_papi-nodejs/libnode.so.93

            unity/native/papi-quickjs/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/papi-quickjs/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so

            unity/native/papi-v8/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/papi-v8/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so
            
            unity/native/papi-python/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/papi-python/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so
            
            unity/native/puerts/build_${{ matrix.platform }}_${{ matrix.arch }}_*/Release/*.dll
            unity/native/puerts/build_${{ matrix.platform }}_${{ matrix.arch }}_*/lib*.so
  pack_nuget:
    name: Pack NuGet
    needs: build
    runs-on: windows-2022
    # NuGet/login 依赖 GitHub OIDC 换发短期 API Key（Trusted Publishing），
    # 必须声明 id-token: write，否则无法签发 OIDC token。
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: unity/nuget/downloaded_natives
      - name: List downloaded artifacts
        run: |
          ls unity/nuget/downloaded_natives
          tree unity/nuget/downloaded_natives /F
        shell: pwsh
      - name: Download Python (Windows)
        run: |
          $destPath = "unity/nuget/downloaded_natives/natives-win-x64/native/papi-python/build_win_x64_papi-python/Release"
          $downloadedEmbedZip = "$env:TEMP/python-win-x64-embed.zip"
          Invoke-WebRequest -Uri $env:PY_WIN_X64_EMBED_URL -OutFile $downloadedEmbedZip
          Expand-Archive -Path $downloadedEmbedZip -DestinationPath $destPath -Force

          $pyVerNoDot = $env:PY_MINOR_VERSION.Replace('.', '')
          if (-not (Test-Path "$destPath/python$pyVerNoDot.dll")) { throw "Missing python$pyVerNoDot.dll" }
          if (-not (Test-Path "$destPath/python$pyVerNoDot.zip")) { throw "Missing bundled stdlib python$pyVerNoDot.zip" }
        shell: pwsh
      - name: Download Python (Linux)
        run: |
          $destPath = "unity/nuget/downloaded_natives/natives-linux-x64/native/papi-python/build_linux_x64_papi-python"
          $downloadedEmbedZip = "$env:TEMP/python-linux-x64.tar.gz"
          Invoke-WebRequest -Uri $env:PY_LINUX_X64_URL -OutFile $downloadedEmbedZip
          tar -xzf $downloadedEmbedZip -C $destPath

          # Move $destPath/python3.14 to $destPath/lib
          Move-Item -Path "$destPath/python/lib/*" -Destination $destPath -Force
          mkdir "$destPath/lib"
          Move-Item -Path "$destPath/python$env:PY_MINOR_VERSION" -Destination "$destPath/lib" -Force
          Remove-Item -Path "$destPath/python" -Recurse -Force

          # libPapiPython.so needs libpythonX.Y.so.1.0 (soname). libpythonX.Y.so is a dev symlink in the tarball,
          # extracting it on Windows may produce a full duplicate, drop it.
          Remove-Item -Path "$destPath/libpython$env:PY_MINOR_VERSION.so" -Force -ErrorAction SilentlyContinue

          $libpython = "$destPath/libpython$env:PY_MINOR_VERSION.so.1.0"
          if (-not (Test-Path $libpython)) { throw "Missing $libpython" }
          if (-not (Test-Path "$destPath/lib/python$env:PY_MINOR_VERSION/os.py")) { throw "Missing bundled stdlib" }

        shell: pwsh
      - name: Download Python (macOS)
        run: |
          $destPath = "unity/nuget/downloaded_natives/natives-osx-arm64/upms/python/Plugins/macOS/arm64"
          $downloadedEmbedZip = "$env:TEMP/python-osx-arm64.tar.gz"
          $downloadUrl = $env:PY_OSX_ARM64_URL
          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadedEmbedZip
          tree unity/nuget/downloaded_natives
          tar -xzf $downloadedEmbedZip -C $destPath

          # Move $destPath/python3.14 to $destPath/lib
          Move-Item -Path "$destPath/python/lib/*" -Destination $destPath -Force
          mkdir "$destPath/lib"
          Move-Item -Path "$destPath/python$env:PY_MINOR_VERSION" -Destination "$destPath/lib" -Force
          Remove-Item -Path "$destPath/python" -Recurse -Force

          $libpython = "$destPath/libpython$env:PY_MINOR_VERSION.dylib"
          if (-not (Test-Path $libpython)) { throw "Missing $libpython" }
          if (-not (Test-Path "$destPath/lib/python$env:PY_MINOR_VERSION/os.py")) { throw "Missing bundled stdlib" }

        shell: pwsh
      # Trusted Publishing (https://learn.microsoft.com/zh-cn/nuget/nuget-org/trusted-publishing):
      # 不再使用固定的 NUGET_API_KEY，改为经 GitHub OIDC 换发 1 小时有效的短期 API Key。
      - name: NuGet login (trusted publishing)
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Run NuGet Packaging and Publishing
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          cd unity/nuget
          .\build.ps1 --NativeAssetsDirectory "$pwd\downloaded_natives" --ProjectsRoot "$pwd" --Source "https://api.nuget.org/v3/index.json" --ApiKey "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
        shell: pwsh
      - name: Run NuGet Packaging
        if: ${{ github.event.inputs.publish != 'true' }}
        run: |
          cd unity/nuget
          .\build.ps1 --NativeAssetsDirectory "$pwd\downloaded_natives" --ProjectsRoot "$pwd"
        shell: pwsh
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages 
          path: |
            unity/nuget/packageOutput/*.nupkg
            unity/nuget/packageOutput/*.snupkg
  windows_test:
    name: window unit test
    needs: pack_nuget
    runs-on: windows-2022
    if: ${{ github.event.inputs.publish != 'true' }}

    steps:
      - uses: actions/checkout@v4
      - name: Download nuget-packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages 
          path: unity/test/nuget/nuget-packages
      - name: Run dotnet test
        run: |
          cd unity/test/nuget/projects
          dotnet test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --no-build --filter "FullyQualifiedName~BundledPythonTest" --logger "console;verbosity=detailed"
        shell: pwsh

  linux_test:
    name: linux unit test
    needs: pack_nuget
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.publish != 'true' }}

    steps:
      - uses: actions/checkout@v4
      - name: Download nuget-packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages 
          path: unity/test/nuget/nuget-packages
      - name: Run dotnet test
        run: |
          cd unity/test/nuget/projects
          dotnet test
          dotnet test --no-build --filter "FullyQualifiedName~BundledPythonTest" --logger "console;verbosity=detailed"
      
  osx_test:
    name: macOS unit test
    needs: pack_nuget
    runs-on: macos-15
    if: ${{ github.event.inputs.publish != 'true' }}

    steps:
      - uses: actions/checkout@v4
      - name: Download nuget-packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: unity/test/nuget/nuget-packages
      - name: Run dotnet test
        run: |
          cd unity/test/nuget/projects
          dotnet test
          dotnet test --no-build --filter "FullyQualifiedName~BundledPythonTest" --logger "console;verbosity=detailed"