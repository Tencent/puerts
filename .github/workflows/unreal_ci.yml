name: unreal ci

on: 
  workflow_dispatch:
  push:
    paths: 
      - unreal/Puerts/Source/**
      - unreal/Puerts/ThirdParty/**
      - unreal/Puerts/Content/**
      - unreal/TestProject/**
      - .github/workflows/unreal_ci.yml
  pull_request:
    paths: 
      - unreal/Puerts/Source/**
      - unreal/Puerts/ThirdParty/**
      - unreal/Puerts/Content/**
      - unreal/TestProject/**
      - .github/workflows/unreal_ci.yml

env:
  Engine: "https://github.com/chexiongsheng/Mini427/releases/download/v1.0.1/Mini427_new_xcode_win2022.tgz"
  # editor runtime overlay of Mini427 for running tests, made by unreal/TestProject/Tools/MakeEnginePack.ps1
  EngineRuntimeWin64: "https://github.com/chexiongsheng/Mini427/releases/download/v1.0.1/Mini427_win64_editor_runtime.tgz"
  # the same for macOS, made by unreal/TestProject/Tools/MakeEnginePack.sh
  EngineRuntimeMac: "https://github.com/chexiongsheng/Mini427/releases/download/v1.0.1/Mini427_mac_editor_runtime.tgz"
  V8_URL: "https://github.com/puerts/backend-v8/releases/download/V8_9.4.146.24__241009/v8_bin_9.4.146.24.tgz"
  NODE_URL: "https://github.com/puerts/backend-nodejs/releases/download/NodeJS_16.16.0_221228/nodejs_bin_16.16.0.tgz"

jobs:
  urls:
    runs-on: ubuntu-latest
    outputs:
      v8: ${{ steps.set-matrix.outputs.v8 }}
      node: ${{ steps.set-matrix.outputs.node }}
    steps:
      - id: set-matrix
        run: |
           echo "v8=${{env.V8_URL}}" >> $GITHUB_OUTPUT
           echo "node=${{env.NODE_URL}}" >> $GITHUB_OUTPUT
        
  window_ci:
    needs: urls
    name: Windows
    runs-on: windows-2022
    strategy:
      matrix:
        cmdinfo:
          - jslib_path: ${{ needs.urls.outputs.v8 }}
            change_backend: ''
          - jslib_path: ${{ needs.urls.outputs.node }}
            change_backend: "sed -i 's/UseNodejs = false/UseNodejs = true/g' unreal/Puerts/Source/PapiV8/PapiV8.Build.cs"
    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
    - name: Prepare
      shell: msys2 {0}
      run: |
        wget -O jslib.tgz -q  ${{ matrix.cmdinfo['jslib_path'] }}
        tar xvfz jslib.tgz -C unreal/Puerts/ThirdParty
        ${{ matrix.cmdinfo['change_backend'] }}
        wget -O temp.tgz -q  ${{env.Engine}} 
        tar xfz temp.tgz
        mkdir output
    - name: Build
      run: |
        Engine\Build\BatchFiles\RunUAT.bat BuildPlugin -Plugin="unreal\Puerts\Puerts.uplugin" -Package="output" -Rocket -TargetPlatforms=Win64 -VS2019

  window_test:
    needs: urls
    name: Windows Test
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
    - name: Cache engine
      id: cache-engine
      uses: actions/cache@v4
      with:
        path: ue427
        key: ue427-${{ env.Engine }}-${{ env.EngineRuntimeWin64 }}-${{ hashFiles('unreal/TestProject/Tools/EnginePack/manifest_win64.txt') }}
    - uses: msys2/setup-msys2@v2
      if: steps.cache-engine.outputs.cache-hit != 'true'
    - name: Prepare engine
      if: steps.cache-engine.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        mkdir -p ue427
        wget -O mini.tgz -q "${{ env.Engine }}"
        wget -O runtime.tgz -q "${{ env.EngineRuntimeWin64 }}"
        tar xfz mini.tgz -C ue427
        tar xfz runtime.tgz -C ue427
        rm mini.tgz runtime.tgz
    - name: Prepare jslib
      shell: pwsh
      run: |
        curl.exe -sSfL -o jslib.tgz "${{ needs.urls.outputs.v8 }}"
        tar -xzf jslib.tgz -C unreal/Puerts/ThirdParty
    - name: Run tests
      shell: pwsh
      run: |
        unreal\TestProject\RunTests.ps1 -Engine "$env:GITHUB_WORKSPACE\ue427" -TimeoutSec 1800
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unreal-test-logs-win64
        path: |
          unreal/TestProject/Saved/Logs
          unreal/TestProject/Saved/AutomationReport
        if-no-files-found: ignore

  mac_test:
    needs: urls
    name: Mac Test
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v3
    - name: Cache engine
      id: cache-engine
      uses: actions/cache@v4
      with:
        path: ue427
        key: ue427-mac-${{ env.Engine }}-${{ env.EngineRuntimeMac }}-${{ hashFiles('unreal/TestProject/Tools/EnginePack/manifest_mac.txt') }}
    - name: Prepare engine
      if: steps.cache-engine.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ue427
        wget -O mini.tgz -q "${{ env.Engine }}"
        wget -O runtime.tgz -q "${{ env.EngineRuntimeMac }}"
        tar xfz mini.tgz -C ue427
        tar xfz runtime.tgz -C ue427
        rm mini.tgz runtime.tgz
    - name: Prepare toolchain
      shell: bash
      run: |
        # the UE4.27 editor is x86_64, UnrealBuildTool.exe needs mono (Mini427 does not ship one)
        /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
        command -v mono || brew install mono
        mono --version | head -n 1
        clang --version | head -n 1
    - name: Prepare jslib
      shell: bash
      run: |
        wget -O jslib.tgz -q "${{ needs.urls.outputs.v8 }}"
        tar xfz jslib.tgz -C unreal/Puerts/ThirdParty
    - name: Run tests
      shell: bash
      run: |
        unreal/TestProject/RunTests.sh --engine "$GITHUB_WORKSPACE/ue427" --timeout 900
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unreal-test-logs-mac
        path: |
          unreal/TestProject/Saved/Logs
          unreal/TestProject/Saved/AutomationReport
        if-no-files-found: ignore

  android_ci:
    needs: urls
    name: Android
    runs-on: windows-2022
    strategy:
      matrix:
        cmdinfo:
          - jslib_path: ${{ needs.urls.outputs.v8 }}
            change_backend: ''
          - jslib_path: ${{ needs.urls.outputs.node }}
            change_backend: "sed -i 's/UseNodejs = false/UseNodejs = true/g' unreal/Puerts/Source/PapiV8/PapiV8.Build.cs"
    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
    - name: Prepare
      shell: msys2 {0}
      run: |
        wget -O jslib.tgz -q  ${{ matrix.cmdinfo['jslib_path'] }}
        tar xvfz jslib.tgz -C unreal/Puerts/ThirdParty
        ${{ matrix.cmdinfo['change_backend'] }}
        wget -O temp.tgz -q  ${{env.Engine}} 
        tar xfz temp.tgz
        mkdir output
    - name: SetupAndroid
      run: |
        Engine\Extras\Android\SetupAndroid.bat
        chcp 65001 #set code page to utf-8
        echo "NDKROOT=C:\Android\android-sdk\ndk\21.4.7075529" >> $env:GITHUB_ENV
    - name: Build
      run: |
        Engine\Build\BatchFiles\RunUAT.bat BuildPlugin -Plugin="unreal\Puerts\Puerts.uplugin" -Package="output" -Rocket -TargetPlatforms=Android -VS2019

  mac_ios_ci:
    needs: urls
    name: Mac and IOS
    runs-on: macos-14
    strategy:
      matrix:
        cmdinfo:
          - jslib_path: ${{ needs.urls.outputs.v8 }}
            change_backend: ''
          - jslib_path: ${{ needs.urls.outputs.node }}
            change_backend: "sed -i '' 's/UseNodejs = false/UseNodejs = true/g' unreal/Puerts/Source/PapiV8/PapiV8.Build.cs"
    steps:
    - uses: actions/checkout@v3
    - name: Prepare
      shell: bash
      run: |
        wget -O jslib.tgz -q  ${{ matrix.cmdinfo['jslib_path'] }}
        tar xvfz jslib.tgz -C unreal/Puerts/ThirdParty
        ${{ matrix.cmdinfo['change_backend'] }}
        wget -O temp.tgz -q  ${{env.Engine}} 
        tar xfz temp.tgz
        mkdir output
    - name: Build
      shell: bash
      run: |
        Engine/Build/BatchFiles/RunUAT.sh BuildPlugin -Plugin=unreal/Puerts/Puerts.uplugin -Package=output -Rocket -TargetPlatforms=Mac+IOS
    #- name: Print Log
    #  shell: bash
    #  run: |
    #    cat "/Users/runner/Library/Logs/Unreal Engine/LocalBuildLogs/UBT-UE4Editor-Mac-Development.txt"
